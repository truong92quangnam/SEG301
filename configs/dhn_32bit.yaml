dataset: "local_cifar10"
data_dir: "cifar-10"
manifest_path: "outputs/splits/manifest_cifar10_survey_source.json"
model_name: "DHN"
backbone: "AlexNet"
hash_bits: 32
pretrained: true

training:
  batch_size: 64
  epochs: 40
  lr_backbone: 0.001
  lr_hash_head: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  lambda_quant: 0.1
  eval_interval: 5
  seed: 2021
  device: "cuda"

evaluation:
  topk: 44000
  chunk_size: 200
  mode: "survey_source"

