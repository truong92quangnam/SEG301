# DHN 32-bit with Multi-task Classification — mAP@54000 protocol
# Multi-task Classification: Joint optimization of Pairwise Loss + Quantization Loss + Cross-Entropy Loss

dataset: "cifar10_pickle"
data_source: "pickle_batches"
data_dir: "cifar-10-batches-py"
manifest_path: "outputs/splits/manifest_cifar10_60k_54k_gallery.json"
model_name: "DHN"
backbone: "AlexNet"
hash_bits: 32
pretrained: true
exp_name: "dhn_32bit_multitask_54k"

training:
  batch_size: 64
  epochs: 40
  lr_backbone: 0.001
  lr_hash_head: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  lambda_quant: 0.1
  eval_interval: 5
  seed: 2021
  device: "cuda"

multitask:
  enabled: true
  num_classes: 10
  cls_source: "hash"
  cls_weight: 1.0

evaluation:
  topk: 54000
  chunk_size: 200
  mode: "survey_source"

