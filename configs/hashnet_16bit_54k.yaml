# HashNet 16-bit Baseline — mAP@54000 protocol
# Data source: cifar-10-batches-py pickle batches (60,000 images)
# Split: 1,000 query / 5,000 train / 54,000 database

dataset: "cifar10_pickle"
data_source: "pickle_batches"
data_dir: "cifar-10-batches-py"
manifest_path: "outputs/splits/manifest_cifar10_60k_54k_gallery.json"
model_name: "HashNet"
backbone: "AlexNet"
hash_bits: 16
pretrained: true
exp_name: "hashnet_16bit_54k"

training:
  batch_size: 64
  epochs: 40
  lr_backbone: 0.001
  lr_hash_head: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  gamma: 0.001
  eval_interval: 5
  seed: 2021
  device: "cuda"

evaluation:
  topk: 54000
  chunk_size: 200
  mode: "survey_source"

