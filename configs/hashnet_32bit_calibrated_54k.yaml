# HashNet 32-bit CALIBRATED Improved — mAP@54000 protocol
# Fix: Lambda scaled by C(16,2)/C(32,2) = 120/496 ≈ 0.242
# lambda_decorr(32) = 0.1 × (120/496) ≈ 0.024  ← prevents capacity strangulation
# lambda_balance(32) = 0.05  (half of 16-bit value, proportionally calibrated)

dataset: "cifar10_pickle"
data_source: "pickle_batches"
data_dir: "cifar-10-batches-py"
manifest_path: "outputs/splits/manifest_cifar10_60k_54k_gallery.json"
model_name: "HashNet"
backbone: "AlexNet"
hash_bits: 32
pretrained: true
exp_name: "hashnet_32bit_calibrated_54k"

training:
  batch_size: 64
  epochs: 40
  lr_backbone: 0.001
  lr_hash_head: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  gamma: 0.001
  eval_interval: 5
  seed: 2021
  device: "cuda"

regularization:
  use_decorr_balance: true
  lambda_balance: 0.05
  lambda_decorr: 0.024

evaluation:
  topk: 54000
  chunk_size: 200
  mode: "survey_source"

